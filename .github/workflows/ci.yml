name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate the Claude Code marketplace and plugin
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict .
          npx -y @anthropic-ai/claude-code plugin validate --strict plugins/benchpod
      - name: Check the Codex manifest
        run: python3 scripts/check_codex_plugin.py plugins/benchpod
      - name: Keep versions in step
        run: python3 scripts/check_versions.py
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # The Desktop extension's tool list must be the server's (the embeddedci-mcp release the
      # plugin pins resolves to), and Codex's tool timeout must cover the longest flash.
      - name: Check the extension's tool list against the MCP server
        run: uv run --no-project --with "$(python3 scripts/gen_tools.py --spec)" python scripts/gen_tools.py --check
      - name: Validate and pack the Claude Desktop extension
        working-directory: mcpb
        run: |
          npx -y @anthropic-ai/mcpb@2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2 pack . ../benchpod.mcpb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchpod.mcpb
          path: benchpod.mcpb

  # Start the Claude Code plugin's server as a client would, on every OS: bin/benchpod-mcp on
  # Linux/macOS, bin/benchpod-mcp.cmd on Windows, with uv on PATH and with the private-uv install.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hide_uv: ["", "1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: matrix.hide_uv == ''
      - name: Start the plugin's MCP server and list its tools
        env:
          SMOKE_HIDE_UV: ${{ matrix.hide_uv }}
        run: |
          npm install --no-save --prefix scripts @modelcontextprotocol/sdk
          node scripts/smoke_plugin.mjs
