name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate the Claude Code marketplace and plugin
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict .
          npx -y @anthropic-ai/claude-code plugin validate --strict plugins/benchpod
      - name: Check the Codex manifest
        run: python3 scripts/check_codex_plugin.py plugins/benchpod
      - name: Keep versions in step
        run: python3 scripts/check_versions.py
      # The README's Tools table must list the manifest's tools (checked against the server below).
      - name: Check the README's tool list against the extension's
        run: python3 scripts/check_readme_tools.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The Desktop extension's tool list must be the server's (the embeddedci-mcp release the
      # plugin pins resolves to), and Codex's tool timeout must cover the longest flash.
      - name: Check the extension's tool list against the MCP server
        run: uv run --no-project --with "$(python3 scripts/gen_tools.py --spec)" python scripts/gen_tools.py --check
      - name: Validate and pack the Claude Desktop extension
        working-directory: mcpb
        run: |
          npx -y @anthropic-ai/mcpb@2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2 pack . ../benchpod.mcpb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchpod.mcpb
          path: benchpod.mcpb

  # Start the plugin's server as Claude Code and Codex would, on every OS: bin/benchpod-mcp on
  # Linux/macOS, bin/benchpod-mcp.cmd on Windows, with uv on PATH and without it.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hide_uv: ["", "1"]
        client: ["", codex]
    # matrix.os stays "ubuntu-latest" because the main ruleset requires the check named
    # "smoke (ubuntu-latest)"; the job itself runs on the pinned ubuntu-24.04 image.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-26.04' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.hide_uv == ''
      - name: Start the plugin's MCP server and list its tools
        env:
          SMOKE_HIDE_UV: ${{ matrix.hide_uv }}
          SMOKE_CLIENT: ${{ matrix.client }}
        run: |
          npm install --no-save --prefix scripts @modelcontextprotocol/sdk
          node scripts/smoke_plugin.mjs
