name: Release

# Push a tag v<version> (matching the version in every manifest) to publish benchpod.mcpb as a
# GitHub release asset. The Claude Code and Codex plugins need no build: both install from the repo.
on:
  push:
    tags: ["v*"]

# Only the publish job gets a write token; packing runs third-party npm code with a read token.
permissions:
  contents: read

jobs:
  pack:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag matches the manifests
        run: python3 scripts/check_versions.py "${GITHUB_REF_NAME#v}"
      # Exact npm tool versions from scripts/package-lock.json; mcpb needs no install scripts.
      - name: Install the pinned npm tools
        run: npm ci --prefix scripts --ignore-scripts
      - name: Pack the Claude Desktop extension
        working-directory: mcpb
        run: |
          ../scripts/node_modules/.bin/mcpb validate manifest.json
          ../scripts/node_modules/.bin/mcpb pack . ../benchpod.mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchpod.mcpb
          path: benchpod.mcpb

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchpod.mcpb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" benchpod.mcpb --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
