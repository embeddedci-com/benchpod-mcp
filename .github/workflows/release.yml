name: Release

# Push a tag v<version> (matching the version in every manifest) to publish benchpod.mcpb as a
# GitHub release asset. The Claude Code and Codex plugins need no build: both install from the repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the tag matches the manifests
        run: python3 scripts/check_versions.py "${GITHUB_REF_NAME#v}"
      - name: Pack the Claude Desktop extension
        working-directory: mcpb
        run: |
          npx -y @anthropic-ai/mcpb@2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2 pack . ../benchpod.mcpb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" benchpod.mcpb --title "$GITHUB_REF_NAME" --generate-notes
